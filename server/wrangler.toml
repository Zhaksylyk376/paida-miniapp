name = "paida-api"
main = "src/index.js"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]

# D1 — SQL база (users / drivers / orders / applications)
[[d1_databases]]
binding = "DB"
database_name = "paida"
# после `wrangler d1 create paida` подставь сюда database_id из вывода
database_id = "452d7120-4b42-433d-bf38-4eee7203f8e8"

# R2 — хранилище фото документов (техпаспорт, права, ID клиента)
[[r2_buckets]]
binding = "R2"
bucket_name = "paida"

# Токены админов через запятую. Ставь через `wrangler secret put ADMIN_TOKENS`
# (или в dev через .dev.vars — см. README)
[vars]
ADMIN_TOKENS = ""
