name = "paida-api"
main = "src/index.js"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]

# D1 — SQL база (users / drivers / orders / applications)
[[d1_databases]]
binding = "DB"
database_name = "paida"
# после `wrangler d1 create paida` подставь сюда database_id из вывода
database_id = "452d7120-4b42-433d-bf38-4eee7203f8e8"

# R2 — хранилище фото документов (техпаспорт, права, ID клиента)
[[r2_buckets]]
binding = "R2"
bucket_name = "paida"

# Токены админов через запятую. Каждый uuid из wx.getStorageSync('paida_device_token')
# может стать админом, если попадёт сюда. Первым — фиксированный owner-uuid.
[vars]
ADMIN_TOKENS = "a1b2c3d4-e5f6-4890-9012-345678901234"
